<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Tektur:wght@400..900&display=swap" rel="stylesheet">   
        <link rel="stylesheet" href="/styles/common.css" />
        <link rel="stylesheet" href="/styles/rooms.css" />
        <link rel="stylesheet" href="/styles/game.css" />
        <link
            href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;0,800;1,300;1,400;1,600;1,700;1,800&display=swap"
            rel="stylesheet"
        />
        <script defer type="module" src="/javascript/game.js"></script>
        <title>Typing Race</title>
    </head>

    <body>
        <div id="root">
            <div id="rooms-page" class="full-screen">
                <header class="header">
                    <div class="logo-container">
                        <img src="../assets/typing-race-logo.png" alt="typing race logo"
                             width="150px" height="150px" class="logo"/>
                        <div>
                            <h1 class="title title-small">Join a room or create a new one!</h1>
                            <button id="add-room-btn" class="button">Create Room</button>
                        </div>
                    </div>

                    <div>
                        <h1 id="user"></h1>
                        <button id="sign-out" class="button quit-btn">Sign Out</button>
                    </div>
                </header>
                <div id="rooms-wrapper">
                    <h1 id="rooms-placeholder">Rooms will be shown here</h1>
                </div>
            </div>
            <div id="game-page" class="flex full-screen display-none">
                <aside class="sidebar">
                    <h1 id="room-name">Room name</h1>
                    <button id="quit-room-btn" class="button quit-btn">Back to Rooms</button>
                    <div id="users-wrapper"></div>
                </aside>
                <main>
                    <div id="game-container">
                        <button id="ready-btn">READY</button>
                        <div id="timer" class="display-none">5</div>
                        <p id="text-container" class="display-none"></p>
                        <div id="game-timer" class="display-none">
                            <span id="game-timer-seconds">5</span>
                            <span> seconds left</span>
                        </div>
                    </div>
                </main>
            </div>
        </div>
    </body>
</html>
