<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Tektur:wght@400..900&display=swap" rel="stylesheet">   
        <link rel="stylesheet" href="/styles/common.css" />
        <link rel="stylesheet" href="/styles/signin.css" />
        <link
            href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;0,800;1,300;1,400;1,600;1,700;1,800&display=swap"
            rel="stylesheet"
        />
        <script defer type="module" src="/javascript/signin.js"></script>
        <title>Sign In</title>
    </head>

    <body>
        <div id="root">
            <div id="signin-page" class="flex-centered">
                <div class="vertical-centered">
                    <img src="assets/typing-race-logo.png" alt="typing race logo"
                         width="400px" height="400px" />
                    <h1 class="title-logo">Typing Race</h1>
                    <div class="flex">
                        <label class="username-input-container">

                            <input id="username-input" autofocus placeholder="username" type="text" />
                        </label>
                        <button id="submit-button" class="no-select button">Submit</button>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
